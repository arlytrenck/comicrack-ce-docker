name: build

on:
  push:
    branches: [main]
    paths: [Dockerfile, "root/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/arlytrenck/comicrack-ce

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: read CE version
        run: echo "CRCE_VERSION=$(sed -n 's/^ARG CRCE_VERSION=//p' Dockerfile)" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: CRCE_VERSION=${{ env.CRCE_VERSION }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.CRCE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
